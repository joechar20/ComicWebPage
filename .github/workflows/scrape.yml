name: Daily Comic Manifest

on:
  schedule:
    # 07:00 UTC = overnight US time; comics are published by then
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Specific date to scrape (YYYY-MM-DD). Leave blank for today.'
        required: false
        default: ''
      backfill_start:
        description: 'Backfill start date (YYYY-MM-DD). Requires backfill_end.'
        required: false
        default: ''
      backfill_end:
        description: 'Backfill end date (YYYY-MM-DD). Requires backfill_start.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 cloudscraper

      - name: Run scraper
        run: |
          if [ -n "${{ github.event.inputs.backfill_start }}" ]; then
            python scrape_manifest.py --backfill \
              "${{ github.event.inputs.backfill_start }}" \
              "${{ github.event.inputs.backfill_end }}"
          elif [ -n "${{ github.event.inputs.date }}" ]; then
            IFS='-' read -r y m d <<< "${{ github.event.inputs.date }}"
            python scrape_manifest.py "$y" "$m" "$d"
          else
            python scrape_manifest.py
          fi

      - name: Commit manifest
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest/
          git diff --staged --quiet || git commit -m "manifest: $(date -u +%Y-%m-%d)"
          git push
